# Test variant (docs/testing.md): a site title that is one 47-character word, a domain-style name with no space or hyphen to break at,
# which must wrap in the nav's brand, the home hero's kicker and the footer's copyright line instead of pushing the Menu button
# off screen at 320px. It also mounts content-long-title/ next to content/ (listing a mount turns off Hugo's default mounts, so they are all listed below): two
# posts in one series whose tag, category, series name, one post title and description word are each one unbroken ~70-character word, which must
# wrap at 320px (#410). Build with: --config hugo.toml,variants/long-title.toml
title = "thebluesfixturesverylongdomainstylename.example"

[module]
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "content-long-title"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "../layouts"
    target = "assets/theblues-layouts"
