# Test variant (README, "Testing the theme"): the build uses a stand-in assets/css/main.css whose two dark-token blocks
# differ, so dark-tokens-check.html must warn (theblues-dark-tokens). This build is meant to produce that warning, so
# it is run without --panicOnWarning. Build with: --config hugo.toml,variants/dark-tokens.toml
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "variants/dark-tokens-assets"
    target = "assets"
