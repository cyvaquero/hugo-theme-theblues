{{- /*
  Browse controls: type chips, the "View options" popover, Clear and the live caption. Hidden until assets/js/wall.js
  runs (progressive enhancement); the wall works without them. Flags the page so baseof loads wall.js.
*/ -}}
{{- .Store.Set "hasWall" true -}}
<div class="ctl" id="ctl" role="region" aria-label="Browse controls" hidden>
  <div class="seg" role="group" aria-label="Show type">
    <button type="button" data-f="all" aria-pressed="true">All <span class="n"></span></button>
    <button type="button" data-f="article" aria-pressed="false">Articles <span class="n"></span></button>
    <button type="button" data-f="photo" aria-pressed="false">Photos <span class="n"></span></button>
  </div>
  <button type="button" class="vbtn" id="vb" aria-expanded="false" aria-controls="pop">View options<span class="bdg" data-badge="opts" hidden></span><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg></button>
  <button type="button" class="clr" data-role="clear" hidden>Clear</button>
  <p class="cap" aria-live="polite"></p>
  <div class="pop" id="pop" role="group" aria-label="View options" hidden>
    <div class="ps"><span class="pl">Mode</span>
      <div class="seg mode" role="group" aria-label="Filter mode">
        <button type="button" data-m2="filter" aria-pressed="true">Filter</button>
        <button type="button" data-m2="highlight" aria-pressed="false">Highlight</button>
      </div>
    </div>
    <label class="ps"><span class="pl">Sort</span>
      <select class="sel" data-role="sort">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="gal">Galleries first</option>
        <option value="art">Articles first</option>
      </select>
    </label>
    <label class="swt"><span>Group by gallery</span><span class="r"><span class="st">Off</span><input type="checkbox" role="switch" data-role="grp"></span></label>
    <button type="button" class="clr" data-role="reset" hidden>Reset</button>
  </div>
</div>
