{{- /* One gallery photo: the X2 thumbnail linking to the X3 size, with its width and height when img-size.html can read
  them (#7). Context: dict "src" "alt". Used by the gallery shortcode. */ -}}
{{- $sz := partialCached "img-size.html" .src .src -}}
<figure><a href="{{ partialCached "smug-full.html" .src .src }}"><img src="{{ .src }}"{{ with $sz }} width="{{ .w }}" height="{{ .h }}"{{ end }} alt="{{ .alt }}" loading="lazy" decoding="async"></a></figure>
