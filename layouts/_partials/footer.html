<footer class="site">
  <div class="soc">{{ partial "social.html" . }}</div>
  {{- with site.Menus.footer }}
  <nav class="fnav" aria-label="Footer">{{ range . }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}</nav>
  {{- end }}
  <p>&copy; {{ site.Title }} {{ now.Year }}</p>
  <p class="ver">Built with Hugo {{ hugo.Version }}{{ with hugo.Data.theblues.version }} and The Blues {{ . }}{{ end }}</p>
</footer>
