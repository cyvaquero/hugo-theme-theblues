{{ define "main" }}
<div class="atw">
  {{ with .Content }}{{ . }}{{ end }}
  {{ range (where site.RegularPages "Section" "post").GroupByDate "2006" }}
  <h2>{{ .Key }}</h2>
  <ul class="atl">
    {{ range .Pages }}
    <li><a href="{{ .RelPermalink }}"><span class="nm">{{ .Title }}</span><span class="c"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2" }}</time></span></a></li>
    {{ end }}
  </ul>
  {{ end }}
</div>
{{ end }}
