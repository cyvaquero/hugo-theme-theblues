name = "The Blues"
description = "A responsive, accessible blog theme for guyheckman.me with a navy, steel blue, and sand palette, light and dark modes, series, and photo galleries."
homepage = "https://github.com/cyvaquero/hugo-theme-theblues"
license = "Apache-2.0"
licenselink = "https://github.com/cyvaquero/hugo-theme-theblues/blob/main/LICENSE"
tags = ["blog", "responsive", "dark mode", "photography", "minimal"]
features = ["light and dark", "responsive", "series taxonomy", "photo galleries", "table of contents", "google analytics (respects Do Not Track and Global Privacy Control)", "disqus comments (click to load)"]
# Metadata for the themes gallery only; Hugo enforces [module.hugoVersion] min in hugo.toml. Keep the two the same.
min_version = "0.163.3"

[author]
  name = "Guy Heckman"
  homepage = "https://guyheckman.me"

# Baseline for the original layout and behavior: the Clean White theme.
# Started from (see NOTICE).
[original]
  author = "Huabing Zhao"
  homepage = "https://zhaohuabing.com"
  repo = "https://github.com/zhaohuabing/hugo-theme-cleanwhite"
