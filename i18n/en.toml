# The text The Blues shows, in English: templates read it with T, and assets/js/wall.js, comments.js, gallery.js and
# search.js get theirs through layouts/_partials/js-text.html. A site translates the theme by adding its own i18n/<language>.toml with
# the entries below (README, "Translating the theme"); an entry the site's file lacks, in any language, is shown in
# English from this file (layouts/_partials/t.html).
#
# Every entry is a table with its text under other (Hugo does not allow plain keys next to one and other). Values are
# plain text, which the templates escape and the scripts insert as text, so write no markup or character references
# except in commentsHosted, which is HTML. Counts have one and other forms, and {{ .Count }} is the number; the scripts, which
# count in the browser, use only the one and other forms of articleCount, photoCount and grouped. Other entries mark where
# the page puts a name or a number: {{ .n }}, {{ .part }} and so on.

# --- Page frame ---
[skipToContent]
other = "Skip to content"
[backToHome]
other = "Back to the home page"
[pageNotFound]
other = "Page not found"
[noPostsYet]
other = "No posts yet."
[undated]
other = "Undated"
[undatedInline]
other = "undated"
[postsHeading]
other = "Posts"
[article]
other = "Article"
[photoGallery]
other = "Photo gallery"
[photoBadge]
other = "Photo"
[opensInNewTab]
other = "(opens in a new tab)"
[embeddedContent]
other = "Embedded content"
[searchLabel]
other = "SEARCH"
[searchUnavailable]
other = "Search is not available yet."
# The search page; assets/js/search.js gets the count, no-results, loading, failed and capped entries through
# js-text.html. The count has one and other forms.
[searchInput]
other = "Search this site"
[searchSubmit]
other = "Search"
[searchResultsHeading]
other = "Search results"
[searchResultCount]
one = "{{ .Count }} result"
other = "{{ .Count }} results"
[searchNoResults]
other = "No results for “{{ .query }}”."
[searchLoading]
other = "Loading the search index…"
[searchFailed]
other = "The search couldn’t be loaded. Try again later."
[searchCapped]
other = "Showing the first {{ .n }}. Add a word to narrow the search."

